<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glyphics</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #fff; font: 16px/1.45 system-ui, -apple-system, sans-serif; }
    main { width: min(420px, 100% - 32px); display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0 0 10px; font-size: 32px; letter-spacing: -0.01em; }
    a { display: block; padding: 18px; border-radius: 4px; background: #fff; color: #000; text-decoration: none; font-size: 18px; text-align: center; }
    a.ghost { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Glyphics</h1>
    <a href="scan/">Scan</a>
    <a class="ghost" href="app/">Make</a>
  </main>
</body>
</html>
