<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glyphics — scan</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: #000; color: #fff; font: 16px/1.45 system-ui, -apple-system, sans-serif; overflow: hidden; }
    #start { position: fixed; inset: 0; display: grid; place-items: center; }
    button { font: 15px system-ui, sans-serif; padding: 13px 18px; border: 0; border-radius: 4px; background: #fff; color: #000; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- Opened directly (or reloaded); from the home page the camera view opens in place. -->
  <div id="start" hidden><button id="go">Scan</button></div>

  <script src="../sketches/lib.js?v=20260925k"></script>
  <script src="../app/rs.js?v=20260925k"></script>
  <script src="../app/tilecode.js?v=20260925k"></script>
  <script src="scan.js?v=20260925k"></script>
  <script src="scanner.js?v=20260925k"></script>
  <script>
    const start = document.getElementById('start');
    async function go() {
      start.hidden = true;
      try { SCANNER.open(await SCANNER.request()); } catch { start.hidden = false; }
    }
    document.getElementById('go').addEventListener('click', go);
    go();
  </script>
</body>
</html>
