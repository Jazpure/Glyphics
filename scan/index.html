<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glyphics — scan</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #000; color: #fff; font: 16px/1.45 system-ui, -apple-system, sans-serif; overflow: hidden; }
    /* The camera fills the screen; the header and the button float over it. */
    .view { position: fixed; inset: 0; background: #000; }
    video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    video { opacity: 0; transition: opacity 0.2s; }
    video.live { opacity: 1; }
    /* No play or pause icons over the live view. */
    video::-webkit-media-controls, video::-webkit-media-controls-start-playback-button, video::-webkit-media-controls-overlay-play-button, video::-webkit-media-controls-panel { display: none !important; -webkit-appearance: none; }
    .start { position: absolute; inset: 0; display: none; place-items: center; }
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 4; display: flex; justify-content: space-between; align-items: center; padding: calc(14px + env(safe-area-inset-top)) 16px 28px; background: linear-gradient(rgba(0, 0, 0, 0.55), transparent); }
    header b { font-size: 18px; }
    header a { color: #fff; text-decoration: none; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; gap: 10px; padding: 32px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0, 0, 0, 0.6)); }
    #status { font: 14px ui-monospace, "SF Mono", Menlo, monospace; text-align: center; min-height: 1.4em; text-shadow: 0 1px 3px #000; }
    button, .file { font: 15px system-ui, sans-serif; padding: 13px 16px; border: 0; border-radius: 4px; background: #fff; color: #000; cursor: pointer; text-align: center; }
    .file { display: block; background: rgba(0, 0, 0, 0.35); color: #fff; box-shadow: inset 0 0 0 1px #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .file input { display: none; }
    /* What a code carried takes over the screen. */
    #result { position: fixed; inset: 0; z-index: 3; display: none; flex-direction: column; background: #000; }
    #result.on { display: flex; }
    #result .target { flex: 1; min-height: 0; display: grid; place-items: center; padding: calc(64px + env(safe-area-inset-top)) 16px 12px; overflow-wrap: anywhere; text-align: center; font-size: 18px; }
    #result img { width: 100%; height: 100%; object-fit: contain; }
    .row { display: flex; gap: 10px; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); }
    .row > * { flex: 1; }
  </style>
</head>
<body>
  <div class="view" id="view">
    <video id="video" playsinline muted autoplay disablepictureinpicture></video>
    <canvas id="overlay"></canvas>
    <div class="start" id="start"><button id="go">Start camera</button></div>
  </div>
  <header><a href="../"><b>Glyphics</b></a><a href="../app/">Make</a></header>
  <div class="bar">
    <div id="status"></div>
    <label class="file">Upload image<input id="photo" type="file" accept="image/*"></label>
  </div>
  <div id="result">
    <div class="target" id="rTarget"></div>
    <div class="row" id="rActions"></div>
  </div>

  <script src="../sketches/lib.js?v=20260925f"></script>
  <script src="../sketches/kit.js?v=20260925f"></script>
  <script src="../sketches/r8/code.js?v=20260925f"></script>
  <script src="../app/rs.js?v=20260925f"></script>
  <script src="../app/imagecode.js?v=20260925f"></script>
  <script src="scan.js?v=20260925f"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const video = $('video'), overlay = $('overlay'), grab = document.createElement('canvas'), gx = grab.getContext('2d', { willReadFrequently: true });
    const KEY = 'glyphics.registry.v1';
    let running = false, remote = null, done = false, busy = false;

    // Reading runs in a worker so the camera view stays smooth.
    const reader = (() => {
      const waiting = new Map(); let seq = 0, w = null;
      try {
        w = new Worker('worker.js' + (document.querySelector('script[src^="scan.js"]').src.match(/\?.*$/) || [''])[0]);
        w.onmessage = ({ data }) => { const f = waiting.get(data.id); waiting.delete(data.id); if (f) f(data.r); };
        w.onerror = () => { w = null; waiting.forEach((f) => f({ found: false })); waiting.clear(); };
      } catch { w = null; }
      const here = SCAN.session();
      return {
        read(px, W, H, msg) {
          if (!w) return Promise.resolve(msg.photo ? readHere(px, W, H) : here.frame(new Uint8ClampedArray(px), W, H, msg.opts));
          const id = ++seq;
          return new Promise((res) => { waiting.set(id, res); w.postMessage({ id, px, W, H, ...msg }, [px]); });
        },
        reset() { here.reset(); if (w) w.postMessage({ reset: true }); },
      };
      function readHere(buf, W, H) {
        const px = new Uint8ClampedArray(buf), one = SCAN.session(); let r = null;
        for (let k = 0; k < 3 && !(r && r.kind); k++) r = one.frame(px, W, H, { tryImage: k === 0, pitches: [7, 10, 8, 9], mirrors: [false, true], steady: 0 });
        return r;
      }
    })();
    const say = (t) => { $('status').textContent = t; };

    const lookup = async (id) => {
      if (!remote) remote = await fetch('../codes.json').then((r) => (r.ok ? r.json() : { codes: {} })).catch(() => ({ codes: {} }));
      let local = {}; try { local = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
      return (remote.codes || {})[id] || local[id] || null;
    };

    function button(label, onClick, ghost) { const b = document.createElement('button'); b.textContent = label; b.onclick = onClick; if (ghost) { b.style.background = 'transparent'; b.style.color = '#fff'; b.style.boxShadow = 'inset 0 0 0 1px #fff'; } return b; }
    async function show(hit) {
      done = true; // the camera keeps running underneath, so Scan again is instant
      const target = $('rTarget'), actions = $('rActions');
      target.replaceChildren(); actions.replaceChildren();
      if (hit.kind === 'image') {
        // The carried image is small; enlarge it for showing and saving.
        const big = enlarge(hit.image.image, 1600);
        const img = new Image(); img.src = big.toDataURL('image/png'); img.alt = 'Image carried by the code';
        target.append(img);
        const a = document.createElement('a'); a.download = 'glyphics-image.png'; a.href = img.src;
        actions.append(button('Save', () => a.click()));
      } else {
        const e = await lookup(hit.id);
        if (!e) target.textContent = 'Not linked';
        else if (e.type === 'url') {
          let u = null; try { u = new URL(e.url); } catch {}
          if (u && /^https?:$/.test(u.protocol)) {
            target.textContent = u.href;
            actions.append(button('Open', () => { location.href = u.href; }));
          } else target.textContent = 'Invalid link';
        } else if (e.type === 'image' && e.image?.startsWith('data:image/')) {
          const img = new Image(); img.src = e.image; img.alt = e.name || 'Shared image'; target.append(img);
        } else target.textContent = 'Not available';
      }
      actions.append(button('Scan again', () => { done = false; reader.reset(); $('result').classList.remove('on'); drawOverlay(null); start(); }, true));
      $('result').classList.add('on');
      say('');
    }

    // A drawing's real colours, and for each shade the real colours it blends.
    function drawingColours(im) {
      const cols = new Map(), n = im.width * im.height;
      for (let i = 0; i < im.data.length; i += 4) {
        const key = (im.data[i] << 16) | (im.data[i + 1] << 8) | im.data[i + 2];
        if (!cols.has(key)) { if (cols.size >= 16) return null; cols.set(key, 0); }
        cols.set(key, cols.get(key) + 1);
      }
      const keys = [...cols.keys()], pal = keys.map((k) => [k >> 16, (k >> 8) & 255, k & 255]), of = IMAGECODE.blendsOf(pal, keys.map((k) => cols.get(k) / n));
      const real = pal.map((_, k) => k).filter((k) => !of[k]);
      const ends = (k, d = 0) => (!of[k] ? [k] : d > 4 ? [] : [...ends(of[k][0], d + 1), ...ends(of[k][1], d + 1)]);
      return {
        real: real.map((k) => pal[k]), share: real.map((k) => cols.get(keys[k]) / n),
        maskOf: new Map(keys.map((key, k) => [key, ends(k).reduce((m, r) => m | (1 << real.indexOf(r)), 0)])),
      };
    }
    // Enlarge a decoded picture. Drawings: smooth, then snap every pixel to a real
    // colour found near it, so lines and lettering come out clean at any size.
    function enlarge(im, target) {
      const t = document.createElement('canvas'); t.width = im.width; t.height = im.height; t.getContext('2d').putImageData(im, 0, 0);
      const k = Math.max(1, target / Math.max(im.width, im.height)), out = document.createElement('canvas');
      out.width = Math.round(im.width * k); out.height = Math.round(im.height * k);
      const ox = out.getContext('2d'); ox.imageSmoothingEnabled = true; ox.imageSmoothingQuality = 'high';
      const dc = drawingColours(im);
      if (!dc || dc.real.length < 2) { ox.drawImage(t, 0, 0, out.width, out.height); return out; }
      const w = im.width, h = im.height, near = new Uint16Array(w * h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        let m = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const X = Math.min(w - 1, Math.max(0, x + dx)), Y = Math.min(h - 1, Math.max(0, y + dy)), i = (Y * w + X) * 4;
          m |= dc.maskOf.get((im.data[i] << 16) | (im.data[i + 1] << 8) | im.data[i + 2]);
        }
        near[y * w + x] = m;
      }
      // Work at twice the size, then halve: the snapped edges come out anti-aliased.
      const big = document.createElement('canvas'), BW = (big.width = out.width * 2), BH = (big.height = out.height * 2), s = w / BW;
      const bx = big.getContext('2d', { willReadFrequently: true }); bx.imageSmoothingEnabled = true; bx.imageSmoothingQuality = 'high';
      bx.filter = `blur(${(k * 0.8).toFixed(2)}px)`; bx.drawImage(t, 0, 0, BW, BH); bx.filter = 'none';
      // Rare colours (ink) win more of each edge, so thin lines stay unbroken.
      const d = bx.getImageData(0, 0, BW, BH), P = dc.real, wt = dc.share.map((f) => Math.max(f, 0.002) ** 0.25);
      for (let y = 0, i = 0; y < BH; y++) {
        const row = Math.min(h - 1, (y * s) | 0) * w;
        for (let x = 0; x < BW; x++, i += 4) {
          const m = near[row + Math.min(w - 1, (x * s) | 0)];
          let best = 0, bd = Infinity;
          for (let c = 0; c < P.length; c++) if (m & (1 << c)) { const e = wt[c] * ((d.data[i] - P[c][0]) ** 2 + (d.data[i + 1] - P[c][1]) ** 2 + (d.data[i + 2] - P[c][2]) ** 2); if (e < bd) { bd = e; best = c; } }
          d.data[i] = P[best][0]; d.data[i + 1] = P[best][1]; d.data[i + 2] = P[best][2];
        }
      }
      bx.putImageData(d, 0, 0);
      ox.drawImage(big, 0, 0, out.width, out.height);
      return out;
    }

    // Outline of what the scanner sees, on top of the video (object-fit: cover).
    function drawOverlay(E, W, H, locked) {
      const r = overlay.getBoundingClientRect(), dpr = devicePixelRatio || 1;
      overlay.width = r.width * dpr; overlay.height = r.height * dpr;
      const x = overlay.getContext('2d'); x.clearRect(0, 0, overlay.width, overlay.height);
      if (!E) return;
      const s = Math.max(overlay.width / W, overlay.height / H), ox = (overlay.width - W * s) / 2, oy = (overlay.height - H * s) / 2;
      x.strokeStyle = locked ? '#3ddc84' : '#ffffff'; x.lineWidth = 3 * dpr;
      x.beginPath(); x.ellipse(ox + E.cx * s, oy + E.cy * s, E.a * s, E.b * s, E.theta, 0, Math.PI * 2); x.stroke();
    }

    // Frames go to the reader at up to 2560 px on the long side (sharp enough for
    // the densest codes, light enough to read quickly).
    function tick() {
      if (!running) return;
      if (!done && !busy && video.readyState >= 2 && video.videoWidth) {
        const k = Math.min(1, 2560 / Math.max(video.videoWidth, video.videoHeight)), W = Math.round(video.videoWidth * k), H = Math.round(video.videoHeight * k);
        if (grab.width !== W || grab.height !== H) { grab.width = W; grab.height = H; }
        gx.drawImage(video, 0, 0, W, H);
        busy = true;
        reader.read(gx.getImageData(0, 0, W, H).data.buffer, W, H, { opts: { tryImage: true, pitches: [7, 10], steady: 1 } }).then((r) => {
          busy = false;
          if (done || !running) return;
          drawOverlay(r.E, W, H, !!r.kind);
          if (r.kind) show(r); else if (r.found) say('Reading…'); else if ($('status').textContent === 'Reading…') say('');
        });
      }
      requestAnimationFrame(tick);
    }

    async function start() {
      if (running) return;
      $('start').style.display = 'none';
      try {
        let stream;
        if (new URLSearchParams(location.search).has('test')) stream = await testStream();
        else stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false });
        video.srcObject = stream; await video.play();
        video.classList.add('live');
        running = true; tick();
      } catch (err) {
        $('start').style.display = 'grid';
        if (err && err.name !== 'NotAllowedError') say('Camera unavailable');
      }
    }
    $('go').addEventListener('click', start);
    // Open straight into scanning, like a scanner; the button is only a fallback
    // for browsers that want a tap before the camera starts.
    start();

    // Release the live camera, so the phone's own camera can open for the photo.
    function stopCamera() {
      running = false;
      const st = video.srcObject; if (st) st.getTracks().forEach((t) => t.stop());
      video.srcObject = null; video.classList.remove('live'); drawOverlay(null); $('start').style.display = 'grid';
    }
    // The phone's own camera (offered in the picker) needs the live camera released first.
    $('photo').closest('label').addEventListener('click', stopCamera);
    $('photo').addEventListener('change', (e) => readPhoto(e.target));
    $('photo').addEventListener('cancel', () => start());
    // A photo or screenshot, at up to 3000 px so small beads keep their detail.
    // If nothing is chosen or nothing reads, live scanning carries on.
    function readPhoto(input) {
      const f = input.files[0];
      input.value = ''; // the same photo can be chosen again
      if (!f) { start(); return; }
      done = false; $('result').classList.remove('on'); say('Reading…');
      const url = URL.createObjectURL(f), img = new Image();
      img.onerror = () => { URL.revokeObjectURL(url); say('Couldn’t open photo'); start(); };
      img.onload = () => {
        const s = Math.min(1, 3000 / Math.max(img.width, img.height)), W = Math.round(img.width * s), H = Math.round(img.height * s);
        const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, W, H);
        URL.revokeObjectURL(url);
        reader.read(x.getImageData(0, 0, W, H).data.buffer, W, H, { photo: true }).then((r) => {
          if (r && r.kind) { show(r); return; }
          say(r && r.found ? 'Couldn’t read' : 'No code found');
          start();
        });
      };
      img.src = url;
    }

    // Test mode (?test): a simulated camera showing a code that drifts, turns and tilts.
    async function testStream() {
      const q = new URLSearchParams(location.search), id = Number(q.get('id') || 271828);
      const code = document.createElement('canvas'); code.width = 2400; code.height = 1800;
      const cx = code.getContext('2d'); cx.setTransform(2, 0, 0, 2, 0, 0);
      if (q.get('test') === 'image') {
        const pic = document.createElement('canvas'); pic.width = 320; pic.height = 240; const p = pic.getContext('2d');
        const g = p.createLinearGradient(0, 0, 0, 240); g.addColorStop(0, '#2f6fd8'); g.addColorStop(1, '#e8743b'); p.fillStyle = g; p.fillRect(0, 0, 320, 240);
        p.fillStyle = '#fff3c4'; p.beginPath(); p.arc(220, 80, 36, 0, 7); p.fill(); p.fillStyle = '#2d5a27'; p.fillRect(0, 180, 320, 60);
        IMAGECODE.draw(cx, IMAGECODE.encode(pic, 7), 3);
      } else {
        await new Promise((res) => { const s = document.createElement('script'); s.src = '../app/glyph.js'; s.onload = res; document.head.append(s); });
        const c = GLYPH.fromUrl(GLYPH.normaliseUrl('jasper-curtis.com'));
        GLYPH.draw(cx, { id, seed: c.seed, params: c.params });
      }
      const cam = document.createElement('canvas'); cam.width = 1920; cam.height = 1080; const k = cam.getContext('2d');
      const t0 = performance.now();
      (function paint() {
        const t = (performance.now() - t0) / 1000;
        k.fillStyle = '#d8d4cc'; k.fillRect(0, 0, 1920, 1080);
        k.save(); k.translate(960 + Math.sin(t * 0.4) * 20, 540 + Math.cos(t * 0.3) * 12); k.rotate(Math.sin(t * 0.2) * 0.3); k.scale(0.68, 0.68 * (0.92 + 0.05 * Math.sin(t * 0.5)));
        k.filter = 'blur(1.1px) saturate(0.9) brightness(0.95)'; k.drawImage(code, -1200, -900); k.restore();
        requestAnimationFrame(paint);
      })();
      return cam.captureStream(30);
    }
  </script>
</body>
</html>
