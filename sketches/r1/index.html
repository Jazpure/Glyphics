<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glyphics — round 1</title>
  <link rel="stylesheet" href="../gallery.css">
</head>
<body>
  <header>
    <div>
      <nav><a href="../">sketches</a> / round 1</nav>
      <h1>Glyphics — round 1</h1>
      <p>Twelve first directions, from calligraphy to atmosphere. Each is a set of rules, so every draw is new. Only the look matters in this round; none of them scan yet.</p>
    </div>
    <button id="all">Redraw all</button>
  </header>
  <main id="grid"></main>
  <div id="lb">
    <canvas id="big"></canvas>
    <div class="bar">
      <button class="prev">←</button><span id="lbt"></span><button class="next">→</button>
      <button class="redraw">Redraw (R)</button><button class="save">PNG</button><button class="close">Close (Esc)</button>
    </div>
  </div>
  <script src="../lib.js"></script>
  <script src="directions.js"></script>
  <script src="../gallery.js"></script>
</body>
</html>
