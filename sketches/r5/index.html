<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glyphics — round 5</title>
  <link rel="stylesheet" href="../gallery.css">
</head>
<body>
  <header>
    <div>
      <nav><a href="../">sketches</a> / round 5</nav>
      <h1>Glyphics — round 5</h1>
      <p>Swell made denser, Weave given directional cohesion, and Beaded Petri given more air. Bead Colonies’ vacuole pattern is scaled up to the whole oval. The switch redraws every design in pure black and white, full colour, or a random mix.</p>
    </div>
    <div class="controls">
      <div class="modes"><button data-mode="mix" class="on">Mix</button><button data-mode="mono">B/W</button><button data-mode="color">Colour</button></div>
      <button id="all">Redraw all</button>
    </div>
  </header>
  <main id="grid"></main>
  <div id="lb">
    <canvas id="big"></canvas>
    <div class="bar">
      <button class="prev">←</button><span id="lbt"></span><button class="next">→</button>
      <button class="redraw">Redraw (R)</button><button class="save">PNG</button><button class="close">Close (Esc)</button>
    </div>
  </div>
  <script src="../lib.js"></script>
  <script src="../kit.js"></script>
  <script src="directions.js"></script>
  <script src="../gallery.js"></script>
</body>
</html>
