<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glyphics — make</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a0a; color: #fff; font: 16px/1.45 system-ui, -apple-system, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; max-width: 900px; margin: 0 auto; }
    header a { color: #fff; text-decoration: none; }
    header b { font-size: 18px; }
    main { max-width: 900px; margin: 0 auto; padding: 0 16px 32px; display: flex; flex-direction: column; gap: 12px; }
    button, .file { font: 15px system-ui, sans-serif; padding: 12px 16px; border: 0; border-radius: 4px; background: transparent; color: #fff; box-shadow: inset 0 0 0 1px #fff; cursor: pointer; text-align: center; }
    button.on, .primary { background: #fff; color: #000; box-shadow: none; }
    button:disabled { opacity: 0.5; cursor: default; }
    .file { display: block; }
    .file input { display: none; }
    input[type=text] { font: 16px system-ui, sans-serif; padding: 12px; border: 0; border-radius: 4px; width: 100%; min-width: 0; }
    canvas { display: block; width: 100%; height: auto; background: #fff; border-radius: 4px; }
    #status { font: 14px ui-monospace, "SF Mono", Menlo, monospace; color: #bbb; min-height: 1.4em; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > * { flex: 1; }
    #tab-link { display: flex; gap: 8px; }
    #tab-link input { flex: 1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><a href="../"><b>Glyphics</b></a></header>
  <main>
    <form id="tab-link"><input id="url" type="text" placeholder="Link" autocomplete="off" spellcheck="false" inputmode="url"><button class="primary" id="go">Make</button></form>
    <label class="file">Upload image<input id="pick" type="file" accept="image/*"></label>

    <div id="status"></div>
    <canvas id="code" aria-label="Code" hidden></canvas>

    <div class="row" id="actions" hidden>
      <button id="reseed">New design</button>
      <button id="share" hidden>Share</button>
      <button id="png">Download</button>
    </div>
  </main>

  <script src="../sketches/lib.js?v=20260925i"></script>
  <script src="../sketches/r9/tiles.js?v=20260925i"></script>
  <script src="rs.js?v=20260925i"></script>
  <script src="tilecode.js?v=20260925i"></script>
  <script>
    const $ = (id) => document.getElementById(id), canvas = $('code');
    // The code carries only an ID; what it points to is kept on the site.
    let code = null, variant = 0;
    const say = (t) => { $('status').textContent = t; };

    // Draw the current code into a canvas, pw pixels wide.
    function paint(target, pw) {
      const k = pw / TILECODE.CW; target.width = pw; target.height = Math.round(TILECODE.CH * k);
      const ctx = target.getContext('2d'); ctx.setTransform(k, 0, 0, k, 0, 0);
      TILECODE.draw(ctx, { id: code.id, seed: (code.seed + Math.imul(variant, 0x9e3779b1)) >>> 0 });
    }
    function render() {
      canvas.hidden = !code; $('actions').hidden = !code;
      if (code) paint(canvas, Math.round((canvas.clientWidth || 800) * Math.min(2, devicePixelRatio || 1)));
    }
    async function store(body, type) {
      const r = await fetch('../api/codes', { method: 'POST', headers: { 'Content-Type': type }, body }).catch(() => null);
      const j = r && (r.headers.get('Content-Type') || '').includes('json') ? await r.json().catch(() => null) : null;
      if (r && r.ok && j && /^[0-9a-f]{16}$/.test(j.id)) return j.id;
      throw new Error(r && r.status === 413 ? 'Image too large' : r && r.status !== 404 && r.status !== 503 ? 'Upload failed' : 'Not available');
    }
    async function make(body, type) {
      code = null; render(); say(type === 'application/json' ? 'Saving…' : 'Uploading…');
      try {
        const id = await store(body, type);
        code = { id, seed: crypto.getRandomValues(new Uint32Array(1))[0] }; variant = 0; say(''); render();
      } catch (e) { say(e.message); }
    }

    // A picture is stored at up to 2048 px on its long side, as a JPEG.
    function takePicture(input) {
      const file = input.files[0]; input.value = '';
      if (!file) return;
      const url = URL.createObjectURL(file), img = new Image();
      img.onerror = () => { URL.revokeObjectURL(url); say('Couldn’t open image'); };
      img.onload = () => {
        const s = Math.min(1, 2048 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((blob) => (blob ? make(blob, 'image/jpeg') : say('Couldn’t open image')), 'image/jpeg', 0.88);
      };
      img.src = url;
    }
    $('pick').addEventListener('change', (e) => takePicture(e.target));

    // A link: add https:// when it is left off.
    $('tab-link').addEventListener('submit', (e) => {
      e.preventDefault();
      let v = $('url').value.trim(); if (!v) return;
      if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = 'https://' + v;
      let u; try { u = new URL(v); } catch { say('Invalid link'); return; }
      if (!/^https?:$/.test(u.protocol) || !u.hostname.includes('.')) { say('Invalid link'); return; }
      make(JSON.stringify({ url: u.href }), 'application/json');
    });

    $('reseed').addEventListener('click', () => { variant++; render(); });
    const pngBlob = () => new Promise((res) => { const out = document.createElement('canvas'); paint(out, 2400); out.toBlob(res, 'image/png'); });
    const fileName = () => `glyphics-${code.id}-${variant}.png`;
    $('png').addEventListener('click', async () => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(await pngBlob()); a.download = fileName(); a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    });
    // Phones can send the code straight from here.
    const canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.png', { type: 'image/png' })] }));
    $('share').hidden = !canShareFiles;
    $('share').addEventListener('click', async () => {
      const file = new File([await pngBlob()], fileName(), { type: 'image/png' });
      try { await navigator.share({ files: [file] }); } catch {}
    });

    let timer;
    addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(render, 150); });
  </script>
</body>
</html>
