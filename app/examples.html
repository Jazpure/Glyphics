<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glyphics — random links</title>
  <style>
    :root { --fg: #111; --muted: #6b6b6b; --line: #d9d9d9; --bg: #f4f4f2; --mono: ui-monospace, "SF Mono", Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
    header { padding: 28px 32px 8px; display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
    header p { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
    header nav { display: flex; gap: 16px; font: 12px var(--mono); align-items: center; }
    header a { color: var(--muted); }
    button { font: 13px var(--mono); padding: 9px 14px; border: 0; border-radius: 2px; background: var(--fg); color: #fff; cursor: pointer; }
    main { padding: 8px 32px 48px; display: flex; flex-direction: column; gap: 28px; }
    .site h2 { margin: 0 0 10px; font: 600 14px var(--mono); border-bottom: 2px solid var(--fg); padding-bottom: 6px; }
    .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    figure { margin: 0; }
    canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #fff; }
    figcaption { margin-top: 8px; font: 12px var(--mono); display: flex; flex-direction: column; gap: 4px; }
    .url { color: var(--fg); overflow-wrap: anywhere; }
    .meta { color: var(--muted); }
    .ok { color: #0a7a2f; } .bad { color: #c21d12; }
    @media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Random links</h1>
      <p>Invented links run through the generator, two pages per made-up site. Pages on one site share a family look (spoke style, swirl, vacuoles, giants). Each page still gets its own ID and its own variation, and every code is read back from its own pixels.</p>
    </div>
    <nav><a href="./">make</a><button id="shuffle">New random links</button></nav>
  </header>
  <main id="out"></main>

  <script src="../sketches/lib.js"></script>
  <script src="../sketches/kit.js"></script>
  <script src="../sketches/r8/code.js"></script>
  <script src="glyph.js"></script>
  <script>
    const A = ['moss', 'harbor', 'quiet', 'ember', 'atlas', 'saffron', 'orbit', 'linen', 'cobalt', 'fern', 'tidal', 'velvet', 'north', 'paper', 'signal', 'loud', 'soft', 'lucky', 'hollow', 'bright'];
    const N = ['garden', 'studio', 'press', 'works', 'lab', 'radio', 'kiln', 'archive', 'field', 'club', 'house', 'supply', 'records', 'bakery', 'gallery', 'cinema', 'atelier', 'bureau'];
    const TLD = ['.com', '.studio', '.net', '.org', '.io', '.art', '.co', '.xyz', '.design', '.club'];
    const PATH = [(r) => `/journal/${r.int(2, 480)}`, (r) => `/shop/${r.pick(A)}-${r.pick(N)}`, (r) => `/work/${r.pick(A)}`, (r) => `/events/2026-${String(r.int(1, 12)).padStart(2, '0')}-${String(r.int(1, 28)).padStart(2, '0')}`, () => '/about', () => '/menu', (r) => `/p/${r.int(1000, 99999).toString(36)}`, (r) => `/${r.pick(A)}/${r.pick(N)}?ref=${r.pick(['poster', 'flyer', 'zine', 'sticker'])}`];

    function randomSites(seed) {
      const r = GL.rng(seed), sites = [];
      while (sites.length < 6) {
        const host = `${r.chance(0.3) ? 'www.' : ''}${r.pick(A)}${r.chance(0.5) ? '-' : ''}${r.pick(N)}${r.pick(TLD)}`;
        if (sites.some((s) => s.host === host)) continue;
        const paths = new Set(); while (paths.size < 2) paths.add(r.pick(PATH)(r));
        sites.push({ host, urls: [...paths].map((p) => `https://${host}${p}`) });
      }
      return sites;
    }

    function render(seed) {
      const out = document.getElementById('out'); out.replaceChildren();
      const dpr = Math.min(2, devicePixelRatio || 1);
      for (const site of randomSites(seed)) {
        const sec = document.createElement('section'), h = document.createElement('h2'), row = document.createElement('div');
        sec.className = 'site'; row.className = 'row'; h.textContent = site.host.replace(/^www\./, '');
        sec.append(h, row); out.append(sec);
        for (const link of site.urls) {
          const fig = document.createElement('figure'), cv = document.createElement('canvas'), cap = document.createElement('figcaption');
          const u = document.createElement('span'), m = document.createElement('span');
          u.className = 'url'; m.className = 'meta'; u.textContent = link;
          cap.append(u, m); fig.append(cv, cap); row.append(fig);
          const c = GLYPH.fromUrl(GLYPH.normaliseUrl(link)), id = GLYPH.idFor(c.key, {});
          const pw = Math.round((cv.clientWidth || 360) * dpr); cv.width = pw; cv.height = Math.round(pw * 0.75);
          const ctx = cv.getContext('2d'); ctx.setTransform(pw / GL.W, 0, 0, pw / GL.W, 0, 0);
          GLYPH.draw(ctx, { id, seed: c.seed, params: c.params });
          const res = CODE.check(cv, id), p = c.params;
          m.innerHTML = `ID ${id} · <span class="${res.good ? 'ok' : 'bad'}">${res.good ? 'reads ✓' : res.label}</span><br>bloom ${p.bloom.toFixed(2)} · swirl ${p.swirl.toFixed(2)} · vacuole ${p.vacuole.toFixed(2)} · collage ${p.collage.toFixed(2)} · giants ${p.giants}`;
        }
      }
    }
    // The first batch is fixed so the page opens on a good spread; the button draws new ones.
    let seed = 1;
    document.getElementById('shuffle').addEventListener('click', () => { seed = (seed * 1664525 + 1013904223) >>> 0; render(seed); });
    render(seed);
  </script>
</body>
</html>
